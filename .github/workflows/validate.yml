name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate laws
        run: node tools/nation.mjs validate
      - name: Run validator regression tests
        run: node --test
      - name: Regenerate index and graph
        run: |
          node tools/nation.mjs index
          node tools/nation.mjs graph
      - name: Fail if generated files drifted
        run: |
          git diff --exit-code LAW_INDEX.md docs/law-graph.md
